<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Читати комікс | Comic Cards</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: #fff;
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      min-height: 62px;
      background: rgba(20,20,20,.96);
      border-bottom: 1px solid #2a2a2a;
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 24px;
    }

    .brand {
      color: #ff9800;
      font-weight: 800;
      letter-spacing: .4px;
      white-space: nowrap;
    }

    .reader-title {
      flex: 1;
      min-width: 0;
      text-align: center;
      font-size: 16px;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .back-btn {
      text-decoration: none;
      background: #2b2b2b;
      color: #fff;
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 14px;
      white-space: nowrap;
    }

    .back-btn:hover {
      background: #3a3a3a;
    }

    .reader-shell {
      width: min(100%, 1050px);
      margin: 0 auto;
      padding: 28px 18px 70px;
    }

    .comic-header {
      background: #181818;
      border: 1px solid #292929;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 22px;
      text-align: center;
    }

    .comic-header h1 {
      font-size: clamp(24px, 4vw, 38px);
      margin-bottom: 8px;
    }

    .comic-header p {
      color: #999;
      line-height: 1.5;
    }

    .chapter-picker {
      background: #181818;
      border: 1px solid #292929;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 24px;
    }

    .chapter-picker h2 {
      font-size: 18px;
      margin-bottom: 13px;
    }

    .chapter-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .chapter-btn {
      border: 1px solid #333;
      background: #222;
      color: #ddd;
      padding: 10px 14px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
    }

    .chapter-btn:hover,
    .chapter-btn.active {
      background: #ff9800;
      border-color: #ff9800;
      color: #fff;
    }

    .chapter-heading {
      text-align: center;
      margin: 30px 0 18px;
    }

    .chapter-heading h2 {
      font-size: clamp(20px, 3vw, 30px);
      margin-bottom: 6px;
    }

    .chapter-heading p {
      color: #888;
      font-size: 14px;
    }

    .pages {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .page-wrap {
      width: 100%;
      text-align: center;
    }

    .page-number {
      color: #777;
      font-size: 12px;
      margin-bottom: 6px;
    }

    .comic-page {
      display: block;
      width: auto;
      max-width: 100%;
      max-height: none;
      margin: 0 auto;
      background: #171717;
      border: 1px solid #272727;
      box-shadow: 0 12px 40px rgba(0,0,0,.35);
    }

    .state {
      background: #181818;
      border: 1px dashed #333;
      border-radius: 14px;
      padding: 55px 25px;
      text-align: center;
      color: #888;
      line-height: 1.6;
    }

    .reader-nav {
      margin-top: 28px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .reader-nav button {
      border: none;
      border-radius: 9px;
      padding: 11px 17px;
      cursor: pointer;
      font-weight: 700;
      background: #2a2a2a;
      color: #fff;
    }

    .reader-nav button.primary {
      background: #ff9800;
    }

    .reader-nav button:disabled {
      opacity: .35;
      cursor: default;
    }

    @media (max-width: 650px) {
      .topbar {
        padding: 9px 12px;
      }

      .brand {
        display: none;
      }

      .reader-title {
        text-align: left;
      }

      .reader-shell {
        padding: 18px 8px 55px;
      }

      .comic-header,
      .chapter-picker {
        border-radius: 10px;
        padding: 16px;
      }

      .pages {
        gap: 8px;
      }

      .comic-page {
        border-left: none;
        border-right: none;
      }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="brand">🃏 COMIC CARDS</div>
    <div class="reader-title" id="topTitle">Читалка</div>
    <a class="back-btn" href="index.html">← На головну</a>
  </header>

  <main class="reader-shell">
    <section class="comic-header" id="comicHeader" style="display:none;">
      <h1 id="comicTitle"></h1>
      <p id="comicDescription"></p>
    </section>

    <section class="chapter-picker" id="chapterPicker" style="display:none;">
      <h2>📖 Розділи</h2>
      <div class="chapter-buttons" id="chapterButtons"></div>
    </section>

    <div id="readerContent">
      <div class="state">Завантаження коміксу…</div>
    </div>
  </main>

  <script>
    const COMICS_STORAGE_KEY = "comic_cards_comics";
    const CHAPTERS_STORAGE_KEY = "comic_cards_chapters";

    const params = new URLSearchParams(window.location.search);
    const comicId = params.get("comic");
    const requestedChapter = params.get("chapter");

    const comicHeader = document.getElementById("comicHeader");
    const comicTitle = document.getElementById("comicTitle");
    const comicDescription = document.getElementById("comicDescription");
    const topTitle = document.getElementById("topTitle");
    const chapterPicker = document.getElementById("chapterPicker");
    const chapterButtons = document.getElementById("chapterButtons");
    const readerContent = document.getElementById("readerContent");

    function loadJson(key) {
      try {
        return JSON.parse(localStorage.getItem(key)) || [];
      } catch {
        return [];
      }
    }

    function extractGoogleDriveFileId(url) {
      if (!url) return null;

      const patterns = [
        /\/file\/d\/([a-zA-Z0-9_-]+)/,
        /[?&]id=([a-zA-Z0-9_-]+)/,
        /\/d\/([a-zA-Z0-9_-]+)/
      ];

      for (const pattern of patterns) {
        const match = url.match(pattern);
        if (match && match[1]) return match[1];
      }

      return null;
    }

    function getPageImageUrl(url) {
      const fileId = extractGoogleDriveFileId(url);

      if (fileId) {
        return `https://drive.google.com/thumbnail?id=${fileId}&sz=w2000`;
      }

      return url;
    }

    function escapeHtml(value = "") {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    const comics = loadJson(COMICS_STORAGE_KEY);
    const chapters = loadJson(CHAPTERS_STORAGE_KEY);

    const comic = comics.find(item => item.id === comicId);
    const comicChapters = chapters
      .filter(item => item.comicId === comicId)
      .sort((a, b) => Number(a.number) - Number(b.number));

    if (!comicId) {
      readerContent.innerHTML = `
        <div class="state">
          Комікс не вибрано.<br>
          Відкрий читалку кнопкою «Читати» з картки коміксу.
        </div>
      `;
    } else if (!comic) {
      readerContent.innerHTML = `
        <div class="state">
          Комікс не знайдено в цьому браузері.
        </div>
      `;
    } else {
      comicHeader.style.display = "block";
      comicTitle.textContent = comic.title;
      comicDescription.textContent = comic.description || "Без опису";
      topTitle.textContent = comic.title;
      document.title = `${comic.title} | Читалка`;

      if (comicChapters.length === 0) {
        readerContent.innerHTML = `
          <div class="state">
            Для цього коміксу ще не додано жодного розділу.
          </div>
        `;
      } else {
        chapterPicker.style.display = "block";

        chapterButtons.innerHTML = comicChapters.map(chapter => `
          <button
            class="chapter-btn"
            type="button"
            data-chapter-id="${escapeHtml(chapter.id)}"
          >
            Розділ ${escapeHtml(chapter.number)}
          </button>
        `).join("");

        const initialChapter =
          comicChapters.find(ch => String(ch.number) === String(requestedChapter)) ||
          comicChapters[0];

        renderChapter(initialChapter.id);

        document.querySelectorAll(".chapter-btn").forEach(button => {
          button.addEventListener("click", () => {
            renderChapter(button.dataset.chapterId);
          });
        });
      }
    }

    function renderChapter(chapterId) {
      const chapter = comicChapters.find(item => item.id === chapterId);
      if (!chapter) return;

      document.querySelectorAll(".chapter-btn").forEach(button => {
        button.classList.toggle(
          "active",
          button.dataset.chapterId === chapterId
        );
      });

      const chapterIndex = comicChapters.findIndex(item => item.id === chapterId);
      const prev = comicChapters[chapterIndex - 1];
      const next = comicChapters[chapterIndex + 1];

      const pages = [...chapter.pages].sort(
        (a, b) => Number(a.page) - Number(b.page)
      );

      readerContent.innerHTML = `
        <div class="chapter-heading">
          <h2>
            Розділ ${escapeHtml(chapter.number)}
            ${chapter.title ? " — " + escapeHtml(chapter.title) : ""}
          </h2>
          <p>Сторінок: ${pages.length}</p>
        </div>

        <div class="pages">
          ${pages.map(page => `
            <div class="page-wrap">
              <div class="page-number">Сторінка ${escapeHtml(page.page)}</div>
              <img
                class="comic-page"
                src="${escapeHtml(getPageImageUrl(page.url))}"
                alt="Сторінка ${escapeHtml(page.page)}"
                loading="lazy"
                referrerpolicy="no-referrer"
              >
            </div>
          `).join("")}
        </div>

        <div class="reader-nav">
          <button
            type="button"
            id="prevChapterBtn"
            ${prev ? "" : "disabled"}
          >← Попередній розділ</button>

          <button
            type="button"
            class="primary"
            id="topBtn"
          >↑ На початок</button>

          <button
            type="button"
            id="nextChapterBtn"
            ${next ? "" : "disabled"}
          >Наступний розділ →</button>
        </div>
      `;

      const prevBtn = document.getElementById("prevChapterBtn");
      const nextBtn = document.getElementById("nextChapterBtn");
      const topBtn = document.getElementById("topBtn");

      if (prev) {
        prevBtn.addEventListener("click", () => {
          renderChapter(prev.id);
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      }

      if (next) {
        nextBtn.addEventListener("click", () => {
          renderChapter(next.id);
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      }

      topBtn.addEventListener("click", () => {
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    }
  </script>
</body>
</html>
