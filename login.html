<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вхід | Comic Cards</title>
  <style>
    body {
      margin: 0;
      background: #121212;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .login-box {
      width: 350px;
      background: #1f1f1f;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
    }
    input {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      background: #ff9800;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }
    button:hover {
      background: #e68a00;
    }
    .link {
      margin-top: 20px;
      font-size: 14px;
    }
    .link a {
      color: #ff9800;
      text-decoration: none;
    }
    #error {
      color: #ff5252;
      margin-top: 15px;
      font-size: 14px;
      min-height: 20px;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <h1>🃏 Comic Cards</h1>
    <h2>Вхід</h2>

    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Пароль" required>

    <button id="loginBtn">Увійти</button>

    <div id="error"></div>

    <div class="link">
      Немає акаунту? <a href="register.html">Зареєструватися</a>
    </div>
  </div>

  <script type="module">
    import { auth } from './js/firebase.js';
    import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const loginBtn = document.getElementById('loginBtn');
    const errorDiv = document.getElementById('error');

    loginBtn.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      errorDiv.textContent = '';

      if (!email || !password) {
        errorDiv.textContent = 'Заповніть усі поля';
        return;
      }

      try {
        loginBtn.disabled = true;
        loginBtn.textContent = 'Вхід...';

        await signInWithEmailAndPassword(auth, email, password);
        
        // Успішний вхід
        window.location.href = 'index.html';
      } catch (error) {
        console.error(error);
        if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
          errorDiv.textContent = 'Невірний email або пароль';
        } else if (error.code === 'auth/invalid-email') {
          errorDiv.textContent = 'Невірний формат email';
        } else {
          errorDiv.textContent = 'Помилка входу. Спробуйте ще раз.';
        }
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Увійти';
      }
    });
  </script>

</body>
</html>
