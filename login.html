<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вхід | Comic Cards</title>
  <style>
    body {
      margin: 0;
      background: #121212;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }

    .login-box {
      width: min(350px, 100%);
      background: #1f1f1f;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      box-sizing: border-box;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 18px;
      cursor: pointer;
      box-sizing: border-box;
    }

    #loginBtn {
      background: #ff9800;
    }

    #loginBtn:hover {
      background: #e68a00;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 22px 0 0;
      color: #777;
      font-size: 13px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #3a3a3a;
    }

    #googleBtn {
      margin-top: 18px;
      background: #fff;
      color: #222;
      border: 1px solid #ddd;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-weight: 700;
    }

    #googleBtn:hover {
      background: #f1f1f1;
    }

    .google-icon {
      width: 20px;
      height: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: #4285f4;
      font-size: 20px;
    }

    button:disabled {
      opacity: .6;
      cursor: default;
    }

    .link {
      margin-top: 20px;
      font-size: 14px;
    }

    .link a {
      color: #ff9800;
      text-decoration: none;
    }

    #error {
      color: #ff5252;
      margin-top: 15px;
      font-size: 14px;
      min-height: 20px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <h1>🃏 Comic Cards</h1>
    <h2>Вхід</h2>

    <input type="email" id="email" placeholder="Email" autocomplete="email" required>
    <input type="password" id="password" placeholder="Пароль" autocomplete="current-password" required>

    <button id="loginBtn">Увійти</button>

    <div class="divider">або</div>

    <button id="googleBtn" type="button">
      <span class="google-icon">G</span>
      Увійти через Google
    </button>

    <div id="error"></div>

    <div class="link">
      Немає акаунту? <a href="register.html">Зареєструватися</a>
    </div>
  </div>

  <script type="module">
    import { auth } from './js/firebase.js';
    import {
      signInWithEmailAndPassword,
      GoogleAuthProvider,
      signInWithPopup
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const loginBtn = document.getElementById('loginBtn');
    const googleBtn = document.getElementById('googleBtn');
    const errorDiv = document.getElementById('error');

    const googleProvider = new GoogleAuthProvider();

    // Після першого успішного Google-входу запам'ятовуємо це локально.
    // Наступного разу спочатку пробуємо тихий вхід без вибору акаунта.
    const GOOGLE_LOGIN_KEY = 'comicCardsGoogleLoginUsed';

    function showAuthError(error) {
      console.error(error);

      if (
        error.code === 'auth/user-not-found' ||
        error.code === 'auth/wrong-password' ||
        error.code === 'auth/invalid-credential'
      ) {
        errorDiv.textContent = 'Невірний email або пароль';
      } else if (error.code === 'auth/invalid-email') {
        errorDiv.textContent = 'Невірний формат email';
      } else if (error.code === 'auth/popup-closed-by-user') {
        errorDiv.textContent = 'Вхід через Google скасовано.';
      } else if (error.code === 'auth/popup-blocked') {
        errorDiv.textContent = 'Браузер заблокував вікно Google. Дозволь спливаючі вікна та спробуй ще раз.';
      } else if (error.code === 'auth/account-exists-with-different-credential') {
        errorDiv.textContent = 'Цей email уже зареєстрований іншим способом. Увійди через email і пароль.';
      } else if (error.code === 'auth/unauthorized-domain') {
        errorDiv.textContent = 'Цей домен ще не дозволений у Firebase Authentication.';
      } else {
        errorDiv.textContent = 'Помилка входу. Спробуйте ще раз.';
      }
    }

    async function loginWithEmail() {
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      errorDiv.textContent = '';

      if (!email || !password) {
        errorDiv.textContent = 'Заповніть усі поля';
        return;
      }

      try {
        loginBtn.disabled = true;
        loginBtn.textContent = 'Вхід...';

        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = 'index.html';
      } catch (error) {
        showAuthError(error);
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Увійти';
      }
    }

    loginBtn.addEventListener('click', loginWithEmail);

    passwordInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') loginWithEmail();
    });

    googleBtn.addEventListener('click', async () => {
      errorDiv.textContent = '';

      try {
        googleBtn.disabled = true;
        googleBtn.innerHTML = '<span class="google-icon">G</span> Вхід...';

        const usedGoogleBefore = localStorage.getItem(GOOGLE_LOGIN_KEY) === '1';
        const provider = new GoogleAuthProvider();

        if (usedGoogleBefore) {
          // Якщо Google уже використовувався на цьому пристрої,
          // просимо не показувати вибір акаунта повторно.
          provider.setCustomParameters({ prompt: 'none' });
        }

        try {
          await signInWithPopup(auth, provider);
        } catch (error) {
          // Якщо браузер/Google не дозволив тихий вхід,
          // автоматично відкриваємо звичайний Google-вхід один раз.
          const silentCodes = [
            'auth/credential-already-in-use',
            'auth/operation-not-allowed',
            'auth/internal-error'
          ];

          const message = String(error?.message || '').toLowerCase();
          const shouldRetry =
            usedGoogleBefore &&
            (
              silentCodes.includes(error?.code) ||
              message.includes('interaction_required') ||
              message.includes('login_required') ||
              message.includes('consent_required')
            );

          if (!shouldRetry) throw error;

          const fallbackProvider = new GoogleAuthProvider();
          await signInWithPopup(auth, fallbackProvider);
        }

        localStorage.setItem(GOOGLE_LOGIN_KEY, '1');
        window.location.href = 'index.html';
      } catch (error) {
        showAuthError(error);
      } finally {
        googleBtn.disabled = false;
        googleBtn.innerHTML = '<span class="google-icon">G</span> Увійти через Google';
      }
    });
  </script>

</body>
</html>
