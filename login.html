<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вхід | Comic Cards</title>

<style>

body{
    margin:0;
    background:#121212;
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.login-box{

    width:350px;
    background:#1f1f1f;
    padding:30px;
    border-radius:15px;
    text-align:center;

}

input{

width:100%;
padding:12px;
margin-top:15px;
border:none;
border-radius:8px;
box-sizing:border-box;

}

button{

width:100%;
padding:14px;
margin-top:20px;
background:#ff9800;
border:none;
border-radius:8px;
color:white;
font-size:18px;
cursor:pointer;

}

button:hover{

background:#e68a00;

}

</style>

</head>

<body>

<div class="login-box">

<h1>🃏 Comic Cards</h1>

<h2>Вхід</h2>

<input type="text" placeholder="Логін">

<input type="password" placeholder="Пароль">

<button>Увійти</button>

</div>

</body>
</html>
