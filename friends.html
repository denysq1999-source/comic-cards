<!DOCTYPE html>
<html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Друзі | Comic Cards</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif}header{padding:12px 18px;background:#121212;border-bottom:1px solid #333;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.brand{font-size:21px;font-weight:900;color:#ff9800}.btn,button{border:0;border-radius:8px;padding:9px 12px;background:#292929;color:#fff;font-weight:800;cursor:pointer;text-decoration:none}.orange{background:#ff9800}.danger{background:#421919;color:#ffb1b1}.ok{background:#183c22;color:#a8f0b8}main{width:min(1000px,100%);margin:auto;padding:20px}.panel{background:#111;border:1px solid #333;border-radius:14px;padding:16px;margin-bottom:16px}h2{margin:0 0 12px}.code{font-size:24px;font-weight:900;color:#ffb347;word-break:break-all}.row{display:flex;gap:8px;flex-wrap:wrap}.row input{flex:1;min-width:220px;background:#090909;color:#fff;border:1px solid #444;border-radius:8px;padding:11px}.list{display:grid;gap:9px}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#0b0b0b;border:1px solid #292929;border-radius:10px;padding:12px}.name{font-weight:900}.sub{font-size:12px;color:#888;margin-top:4px}.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.empty{color:#777;padding:10px}.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}.tab.active{background:#ff9800}.hidden{display:none}@media(max-width:650px){.item{align-items:flex-start;flex-direction:column}.actions{justify-content:flex-start}}
.report-mini{border:1px solid #742525;background:#2b1111;color:#ff7777;border-radius:8px;padding:8px 10px;font-weight:900;cursor:pointer}.report-overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;z-index:999}.report-modal{width:min(480px,92vw);background:#111;border:1px solid #6b2424;border-radius:14px;padding:18px}.report-modal textarea{width:100%;min-height:120px;background:#080808;color:#fff;border:1px solid #444;border-radius:9px;padding:10px}.msg-mini{background:#17304a;color:#b9ddff}.dm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;z-index:998}.dm-modal{width:min(620px,94vw);background:#111;border:1px solid #31516f;border-radius:14px;padding:14px}.dm-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.dm-list{height:min(430px,55vh);overflow:auto;background:#080808;border:1px solid #292929;border-radius:10px;padding:10px;margin:10px 0;display:flex;flex-direction:column;gap:8px}.dm-bubble{max-width:78%;padding:9px 11px;border-radius:11px;background:#242424;white-space:pre-wrap;word-break:break-word}.dm-bubble.mine{align-self:flex-end;background:#5c3b00}.dm-bubble.theirs{align-self:flex-start}.dm-time{font-size:10px;color:#999;margin-top:4px}.dm-send{display:flex;gap:7px}.dm-send input{flex:1;background:#080808;color:#fff;border:1px solid #444;border-radius:8px;padding:10px}</style></head><body>
<header><div class="brand">👥 Друзі Comic Cards</div><div><a class="btn" href="duels.html">⚔️ Дуелі</a> <a class="btn" href="profile.html">👤 Профіль</a></div></header>
<main>
<section class="panel"><h2>🪪 Твій код друга</h2><div class="code" id="myCode">...</div><div class="sub">Дай цей код іншому гравцю — він зможе знайти тебе без пошуку по ніку.</div><div class="row" style="margin-top:10px"><button id="copyCode">📋 Копіювати код</button></div></section>
<section class="panel"><h2>➕ Додати друга за кодом</h2><div class="row"><input id="friendCode" maxlength="40" placeholder="Введи код друга"><button class="orange" id="sendByCode">Надіслати заявку</button></div></section>
<div class="tabs"><button class="tab active" data-tab="friends">👥 Друзі</button><button class="tab" data-tab="incoming">📥 Вхідні <span id="incomingCount"></span></button><button class="tab" data-tab="outgoing">📤 Надіслані</button><button class="tab" data-tab="blocked">🚫 Заблоковані</button></div>
<section class="panel tabpage" id="friendsPage"><h2>👥 Мої друзі</h2><div class="list" id="friendsList"></div></section>
<section class="panel tabpage hidden" id="incomingPage"><h2>📥 Вхідні заявки</h2><div class="list" id="incomingList"></div></section>
<section class="panel tabpage hidden" id="outgoingPage"><h2>📤 Надіслані заявки</h2><div class="list" id="outgoingList"></div></section>
<section class="panel tabpage hidden" id="blockedPage"><h2>🚫 Заблоковані</h2><div class="list" id="blockedList"></div></section>
</main><div class="dm-overlay" id="dmOverlay"><div class="dm-modal"><div class="dm-head"><h2 id="dmTitle">💬 Особисті повідомлення</h2><div><button class="danger" id="dmClear">🗑️ Видалити переписку</button> <button id="dmClose">✕</button></div></div><div class="dm-list" id="dmList"><div class="empty">Завантаження...</div></div><div class="dm-send"><input id="dmText" maxlength="500" placeholder="Написати повідомлення..."><button class="orange" id="dmSend">Надіслати</button></div></div></div><div class="report-overlay" id="reportOverlay"><div class="report-modal"><h2>🔺 Репорт на гравця</h2><p id="reportWho" class="sub"></p><textarea id="reportText" maxlength="800" placeholder="Повідомлення для адміністратора..."></textarea><div class="row" style="justify-content:flex-end;margin-top:10px"><button id="reportCancel">Скасувати</button><button class="report-mini" id="reportSend">Надіслати</button></div></div></div>
<script type="module">
import { auth } from './js/firebase.js';
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore,collection,getDocs,getDoc,doc,query,where,setDoc,deleteDoc,runTransaction,serverTimestamp,addDoc,onSnapshot,writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const db=getFirestore(auth.app);let user=null,profiles=[];
const $=id=>document.getElementById(id);function esc(v=""){return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}
function friendCode(uid){const c=String(uid||"").replace(/[^a-zA-Z0-9]/g,"").toUpperCase();return `FR-${c.slice(0,6)}-${c.slice(-4)}`}
function pairId(a,b){return [a,b].sort().join("__")}function nameFor(uid){const p=profiles.find(x=>x.id===uid);return p?.displayName||p?.name||`Гравець ${uid.slice(0,6)}`}
async function ensureCode(){const ref=doc(db,"player_profiles",user.uid),snap=await getDoc(ref),code=friendCode(user.uid);if(!snap.exists())await setDoc(ref,{userId:user.uid,displayName:user.displayName||user.email?.split("@")[0]||"Гравець",friendCode:code},{merge:true});else if(snap.data().friendCode!==code)await setDoc(ref,{friendCode:code},{merge:true});$('myCode').textContent=code}
async function blockedBetween(a,b){const [x,y]=await Promise.all([getDoc(doc(db,"friend_blocks",`${a}__${b}`)),getDoc(doc(db,"friend_blocks",`${b}__${a}`))]);return x.exists()||y.exists()}
async function sendRequest(toId){if(toId===user.uid){alert("Себе в друзі додавати не треба 😹");return}if(await blockedBetween(user.uid,toId)){alert("Додавання недоступне: один із гравців заблокував іншого.");return}if((await getDoc(doc(db,"friendships",pairId(user.uid,toId)))).exists()){alert("Ви вже друзі 😼");return}const incoming=doc(db,"friend_requests",`${toId}__${user.uid}`);if((await getDoc(incoming)).exists()){await acceptRequest(toId);return}await setDoc(doc(db,"friend_requests",`${user.uid}__${toId}`),{fromId:user.uid,toId,status:"pending",createdAt:serverTimestamp()});alert("Заявку надіслано 👥");await loadAll()}
async function acceptRequest(fromId){const reqRef=doc(db,"friend_requests",`${fromId}__${user.uid}`),fRef=doc(db,"friendships",pairId(user.uid,fromId));await runTransaction(db,async tx=>{const r=await tx.get(reqRef);if(!r.exists())throw new Error("NO_REQUEST");tx.set(fRef,{users:[fromId,user.uid],userA:[fromId,user.uid].sort()[0],userB:[fromId,user.uid].sort()[1],createdAt:serverTimestamp()});tx.delete(reqRef)});await loadAll()}
async function rejectRequest(fromId){await deleteDoc(doc(db,"friend_requests",`${fromId}__${user.uid}`));await loadAll()}
async function cancelRequest(toId){await deleteDoc(doc(db,"friend_requests",`${user.uid}__${toId}`));await loadAll()}
async function removeFriend(other){if(!confirm(`Видалити ${nameFor(other)} з друзів?`))return;await deleteDoc(doc(db,"friendships",pairId(user.uid,other)));await loadAll()}
async function blockUser(other){if(!confirm(`Заблокувати ${nameFor(other)}? Він не зможе надсилати тобі заявки в друзі.`))return;await setDoc(doc(db,"friend_blocks",`${user.uid}__${other}`),{blockerId:user.uid,blockedId:other,createdAt:serverTimestamp()});const ops=[doc(db,"friendships",pairId(user.uid,other)),doc(db,"friend_requests",`${user.uid}__${other}`),doc(db,"friend_requests",`${other}__${user.uid}`)];for(const r of ops){try{await deleteDoc(r)}catch{}}await loadAll()}
async function unblock(other){await deleteDoc(doc(db,"friend_blocks",`${user.uid}__${other}`));await loadAll()}
let dmTarget=null,dmUnsub=null;function dmId(a,b){return [a,b].sort().join("__")}function fmtTime(ts){try{return ts?.toDate?.().toLocaleString("uk-UA")||""}catch{return ""}}
function openDM(uid){dmTarget=uid;$('dmTitle').textContent=`💬 ${nameFor(uid)}`;$('dmOverlay').style.display='flex';$('dmList').innerHTML='<div class="empty">Завантаження...</div>';if(dmUnsub)dmUnsub();const cid=dmId(user.uid,uid);getDoc(doc(db,'private_chat_clears',`${user.uid}__${cid}`)).then(clearSnap=>{const clearSec=clearSnap.exists()?(clearSnap.data().clearedAt?.seconds||0):0;dmUnsub=onSnapshot(query(collection(db,'private_messages'),where('conversationId','==',cid)),snap=>{const arr=snap.docs.map(d=>({id:d.id,...d.data()})).filter(m=>(m.createdAt?.seconds||0)>clearSec).sort((a,b)=>(a.createdAt?.seconds||0)-(b.createdAt?.seconds||0));$('dmList').innerHTML=arr.length?arr.map(m=>`<div class="dm-bubble ${m.senderId===user.uid?'mine':'theirs'}"><div>${esc(m.text)}</div><div class="dm-time">${esc(fmtTime(m.createdAt))}</div></div>`).join(''):'<div class="empty">Переписки ще немає. Напиши першим 😼</div>';$('dmList').scrollTop=$('dmList').scrollHeight},e=>{$('dmList').innerHTML='<div class="empty">Не вдалося завантажити повідомлення.</div>';console.error(e)});window.__dmClearSec=clearSec});}
function closeDM(){if(dmUnsub){dmUnsub();dmUnsub=null}$('dmOverlay').style.display='none';dmTarget=null}
$('dmClose').onclick=closeDM;$('dmOverlay').onclick=e=>{if(e.target===$('dmOverlay'))closeDM()};$('dmSend').onclick=async()=>{const text=$('dmText').value.trim();if(!dmTarget||!text)return;try{const cid=dmId(user.uid,dmTarget);await addDoc(collection(db,'private_messages'),{conversationId:cid,senderId:user.uid,receiverId:dmTarget,text:text.slice(0,500),createdAt:serverTimestamp()});$('dmText').value=''}catch(e){console.error(e);alert('Не вдалося надіслати повідомлення.')}};$('dmText').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('dmSend').click()}});$('dmClear').onclick=async()=>{if(!dmTarget||!confirm('Видалити переписку для себе? У друга вона залишиться.'))return;try{const cid=dmId(user.uid,dmTarget);await setDoc(doc(db,'private_chat_clears',`${user.uid}__${cid}`),{userId:user.uid,conversationId:cid,clearedAt:serverTimestamp()});alert('Переписку приховано для тебе.');closeDM()}catch(e){console.error(e);alert('Не вдалося видалити переписку.')}};
function item(uid,buttons){return `<div class="item"><div><div class="name">${esc(nameFor(uid))}</div><div class="sub">${esc(profiles.find(x=>x.id===uid)?.friendCode||friendCode(uid))}</div></div><div class="actions">${buttons}</div></div>`}
let reportTarget=null;function openReport(uid){reportTarget=uid;$('reportWho').textContent=`Гравець: ${nameFor(uid)}`;$('reportText').value="";$('reportOverlay').style.display="flex";} $('reportCancel').onclick=()=>{$('reportOverlay').style.display="none"};$('reportOverlay').onclick=e=>{if(e.target===$('reportOverlay'))$('reportOverlay').style.display="none"};$('reportSend').onclick=async()=>{const text=$('reportText').value.trim();if(!reportTarget||text.length<3){alert("Напиши причину репорту.");return} $('reportSend').disabled=true;try{await addDoc(collection(db,"player_reports"),{reporterId:user.uid,targetId:reportTarget,duelId:null,message:text.slice(0,800),status:"new",createdAt:serverTimestamp()});$('reportOverlay').style.display="none";alert("Репорт надіслано адміністратору.");}catch(e){console.error(e);alert("Не вдалося надіслати репорт.");}finally{$('reportSend').disabled=false}};
async function loadAll(){const [ps,fa,fb,ri,ro,bl]=await Promise.all([getDocs(collection(db,"player_profiles")),getDocs(query(collection(db,"friendships"),where("userA","==",user.uid))),getDocs(query(collection(db,"friendships"),where("userB","==",user.uid))),getDocs(query(collection(db,"friend_requests"),where("toId","==",user.uid))),getDocs(query(collection(db,"friend_requests"),where("fromId","==",user.uid))),getDocs(query(collection(db,"friend_blocks"),where("blockerId","==",user.uid)))]);profiles=ps.docs.map(d=>({id:d.id,...d.data()}));const friends=[...fa.docs,...fb.docs].map(d=>{const x=d.data();return x.userA===user.uid?x.userB:x.userA});const incoming=ri.docs.map(d=>d.data()).filter(x=>x.status==="pending"),outgoing=ro.docs.map(d=>d.data()).filter(x=>x.status==="pending"),blocked=bl.docs.map(d=>d.data());$('friendsList').innerHTML=friends.length?friends.map(uid=>item(uid,`<button class="msg-mini" data-dm="${esc(uid)}">💬 Повідомлення</button><button class="danger" data-remove="${esc(uid)}">Видалити</button><button class="danger" data-block="${esc(uid)}">🚫 Блок</button><button class="report-mini" data-report="${esc(uid)}">🔺 Репорт</button>`)).join(""):'<div class="empty">Поки друзів немає.</div>';$('incomingList').innerHTML=incoming.length?incoming.map(x=>item(x.fromId,`<button class="ok" data-accept="${esc(x.fromId)}">✅ Прийняти</button><button data-reject="${esc(x.fromId)}">Відхилити</button><button class="danger" data-block="${esc(x.fromId)}">🚫 Блок</button><button class="report-mini" data-report="${esc(x.fromId)}">🔺 Репорт</button>`)).join(""):'<div class="empty">Немає вхідних заявок.</div>';$('outgoingList').innerHTML=outgoing.length?outgoing.map(x=>item(x.toId,`<button data-cancel="${esc(x.toId)}">Скасувати</button><button class="danger" data-block="${esc(x.toId)}">🚫 Блок</button><button class="report-mini" data-report="${esc(x.toId)}">🔺 Репорт</button>`)).join(""):'<div class="empty">Немає надісланих заявок.</div>';$('blockedList').innerHTML=blocked.length?blocked.map(x=>item(x.blockedId,`<button data-unblock="${esc(x.blockedId)}">Розблокувати</button>`)).join(""):'<div class="empty">Список блокування порожній.</div>';$('incomingCount').textContent=incoming.length?`(${incoming.length})`:"";bindActions()}
function bindActions(){document.querySelectorAll('[data-accept]').forEach(b=>b.onclick=()=>acceptRequest(b.dataset.accept));document.querySelectorAll('[data-reject]').forEach(b=>b.onclick=()=>rejectRequest(b.dataset.reject));document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>cancelRequest(b.dataset.cancel));document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>removeFriend(b.dataset.remove));document.querySelectorAll('[data-block]').forEach(b=>b.onclick=()=>blockUser(b.dataset.block));document.querySelectorAll('[data-unblock]').forEach(b=>b.onclick=()=>unblock(b.dataset.unblock));document.querySelectorAll('[data-report]').forEach(b=>b.onclick=()=>openReport(b.dataset.report));document.querySelectorAll('[data-dm]').forEach(b=>b.onclick=()=>openDM(b.dataset.dm))}
$('sendByCode').onclick=async()=>{const code=$('friendCode').value.trim().toUpperCase();if(!code)return;try{const q=query(collection(db,"player_profiles"),where("friendCode","==",code)),s=await getDocs(q);if(s.empty){alert("Гравця з таким кодом не знайдено.");return}await sendRequest(s.docs[0].id);$('friendCode').value=""}catch(e){console.error('Friend code error',e);alert(`Не вдалося додати друга: ${e.code||e.message||'помилка'}`)}};$('copyCode').onclick=async()=>{await navigator.clipboard.writeText($('myCode').textContent);$('copyCode').textContent="✅ Скопійовано";setTimeout(()=>$('copyCode').textContent="📋 Копіювати код",1200)};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tabpage').forEach(x=>x.classList.add('hidden'));b.classList.add('active');$(b.dataset.tab+'Page').classList.remove('hidden')});
onAuthStateChanged(auth,async u=>{if(!u){location.href="login.html";return}user=u;try{await ensureCode();await loadAll()}catch(e){console.error(e);alert("Не вдалося завантажити систему друзів. Перевір Firestore Rules.")}});
</script></body></html>
