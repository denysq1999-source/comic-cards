<!DOCTYPE html>
<html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Турніри | Comic Cards</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0f0f0f;color:#fff;font-family:Arial,sans-serif}header{background:#1a1a1a;border-bottom:1px solid #2d2d2d;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.brand{font-size:23px;color:#ff9800;font-weight:900}.btn{background:#2b2b2b;color:#fff;text-decoration:none;border:0;border-radius:8px;padding:10px 13px;font-weight:800;cursor:pointer}main{width:min(1050px,calc(100% - 28px));margin:30px auto 70px}.hero,.card{background:#171717;border:1px solid #2c2c2c;border-radius:15px;padding:22px}.hero{margin-bottom:20px}.hero h1{margin:0 0 8px}.hero p{color:#999;margin:0;line-height:1.5}.list{display:grid;gap:14px}.title{font-size:20px;font-weight:900}.meta{color:#999;font-size:13px;margin:8px 0}.prize{color:#ffd166;font-weight:900}.join{border:0;border-radius:8px;padding:10px 13px;background:#ff9800;color:#fff;font-weight:900;cursor:pointer}.join:disabled{opacity:.5}.empty{text-align:center;color:#777;padding:40px;border:1px dashed #333;border-radius:12px}</style></head>
<body><header><div class="brand">🏟️ Турніри</div><div><a class="btn" href="duels.html">⚔️ Дуелі</a> <a class="btn" href="leaderboard.html">🏆 Рейтинг</a> <a class="btn" href="index.html">← Головна</a></div></header>
<main><section class="hero"><h1>🏟️ Турнірні події</h1><p>У турнірних матчах використовується окрема арена. Реєстрація — без ставки; призові монети задає адміністратор.</p></section><div class="list" id="list"><div class="empty">Завантаження...</div></div></main>
<script type="module">
import { auth } from './js/firebase.js';
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore,collection,getDocs,setDoc,doc,serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const db=getFirestore(auth.app),list=document.getElementById("list");let user=null,tournaments=[],entries=[];
function esc(v=""){return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")}
async function load(){
 const [t,e]=await Promise.all([getDocs(collection(db,"tournaments")),getDocs(collection(db,"tournament_entries"))]);
 tournaments=t.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.enabled!==false);
 entries=e.docs.map(d=>({id:d.id,...d.data()}));
 if(!tournaments.length){list.innerHTML='<div class="empty">Активних турнірів поки немає.</div>';return}
 list.innerHTML=tournaments.map(tn=>{const joined=entries.some(x=>x.tournamentId===tn.id&&x.userId===user.uid);const count=entries.filter(x=>x.tournamentId===tn.id).length;return `<article class="card"><div class="title">${esc(tn.name||"Турнір")}</div><div class="meta">${esc(tn.description||"")}<br>Учасників: ${count} · Статус: ${esc(tn.status||"registration")}</div><div class="prize">🏆 Приз: ${Number(tn.prizeCoins||0)} 💰</div><br><button class="join" data-join="${tn.id}" ${joined||tn.status!=="registration"?"disabled":""}>${joined?"✅ Зареєстровано":tn.status==="registration"?"Приєднатися":"Реєстрацію закрито"}</button></article>`}).join("");
 document.querySelectorAll("[data-join]").forEach(b=>b.addEventListener("click",async()=>{await setDoc(doc(db,"tournament_entries",`${b.dataset.join}_${user.uid}`),{tournamentId:b.dataset.join,userId:user.uid,joinedAt:serverTimestamp()});await load()}));
}
onAuthStateChanged(auth,async u=>{if(!u){location.href="login.html";return}user=u;await load()});
</script></body></html>
