<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comic Cards</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    header {
      background: #1f1f1f;
      padding: 20px;
      font-size: 32px;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #2d2d2d;
    }

    main {
      width: min(1200px, calc(100% - 32px));
      margin: 50px auto 70px;
    }

    .button {
      display: inline-block;
      padding: 15px 35px;
      background: #ff9800;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-size: 20px;
      margin: 10px;
      border: none;
      cursor: pointer;
    }

    .button:hover {
      background: #e68900;
    }

    .button.secondary {
      background: #333;
    }

    .button.secondary:hover {
      background: #444;
    }

    .user-info {
      margin-top: 20px;
      color: #aaa;
      font-size: 14px;
    }

    #adminBtn {
      display: none;
    }

    .auth-actions {
      margin-top: 18px;
    }

    /* ===== Гостьовий екран ===== */
    .guest-box {
      max-width: 650px;
      margin: 65px auto 0;
      background: #1a1a1a;
      border: 1px solid #2d2d2d;
      border-radius: 16px;
      padding: 42px 28px;
    }

    .guest-box h1 {
      margin-top: 0;
      font-size: 34px;
    }

    .guest-box p {
      color: #aaa;
      line-height: 1.6;
    }

    /* ===== Каталог ===== */
    #catalogSection {
      display: none;
      margin-top: 35px;
    }

    .catalog-head {
      margin-bottom: 28px;
    }

    .catalog-head h1 {
      font-size: 34px;
      margin-bottom: 8px;
    }

    .catalog-head p {
      color: #999;
      margin: 0;
    }

    .comics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 22px;
      text-align: left;
    }

    .comic-card {
      background: #1a1a1a;
      border: 1px solid #2d2d2d;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .comic-cover {
      aspect-ratio: 2 / 3;
      background: #0d0d0d;
      overflow: hidden;
    }

    .comic-cover img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .comic-info {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 11px;
      flex: 1;
    }

    .comic-title {
      font-size: 19px;
      font-weight: 700;
      line-height: 1.3;
    }

    .comic-description {
      color: #aaa;
      font-size: 14px;
      line-height: 1.5;
      flex: 1;
    }

    .rating-summary {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      color: #ccc;
      font-size: 14px;
    }

    .rating-stars {
      color: #ffb300;
      letter-spacing: 2px;
      font-size: 18px;
      white-space: nowrap;
    }

    .rating-count {
      color: #888;
      font-size: 13px;
    }

    .rate-box {
      border-top: 1px solid #2c2c2c;
      padding-top: 11px;
    }

    .rate-label {
      display: block;
      color: #888;
      font-size: 12px;
      margin-bottom: 6px;
    }

    .rate-stars {
      display: flex;
      gap: 4px;
    }

    .rate-star {
      border: none;
      background: transparent;
      color: #555;
      font-size: 25px;
      cursor: pointer;
      padding: 0;
      line-height: 1;
    }

    .rate-star:hover,
    .rate-star.active {
      color: #ffb300;
    }

    .read-btn {
      display: block;
      margin-top: 4px;
      background: #ff9800;
      color: white;
      text-align: center;
      text-decoration: none;
      padding: 12px 14px;
      border-radius: 9px;
      font-size: 15px;
      font-weight: 700;
    }

    .read-btn:hover {
      background: #e68900;
    }

    .empty-state {
      grid-column: 1 / -1;
      background: #1a1a1a;
      border: 1px dashed #333;
      border-radius: 14px;
      padding: 50px 20px;
      text-align: center;
      color: #777;
    }

    @media (max-width: 650px) {
      header {
        font-size: 25px;
        padding: 16px;
      }

      main {
        width: min(100% - 20px, 1200px);
        margin-top: 30px;
      }

      .guest-box {
        margin-top: 35px;
      }

      .catalog-head h1 {
        font-size: 28px;
      }

      .comics-grid {
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 14px;
      }
    }
  </style>
</head>

<body>

  <header>
    🃏 Comic Cards
  </header>

  <main>
    <!-- Для неавторизованих -->
    <section class="guest-box" id="guestSection">
      <h1>Ласкаво просимо!</h1>
      <p>
        Увійди або зареєструйся, щоб читати комікси та виставляти оцінки.
      </p>

      <div>
        <a class="button" id="loginBtn" href="login.html">Увійти</a>
        <a class="button secondary" href="register.html">Реєстрація</a>
      </div>
    </section>

    <!-- Для авторизованих -->
    <section id="catalogSection">
      <div class="catalog-head">
        <h1>📚 Комікси</h1>
        <p>Обирай історію, читай розділи та залишай свою оцінку.</p>
      </div>

      <div class="comics-grid" id="comicsGrid"></div>
    </section>

    <!-- Кнопка адмінки тільки адміну -->
    <div>
      <a class="button secondary" id="adminBtn" href="admin.html">⚙️ Адмін-панель</a>
    </div>

    <div class="user-info" id="userInfo"></div>

    <div class="auth-actions">
      <button class="button secondary" id="logoutBtn" style="display:none;">Вийти</button>
    </div>
  </main>

  <script type="module">
    import { auth } from './js/firebase.js';
    import {
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const ADMIN_UID = "pSMXTD18TYYLLA3CnBb8shBzHII3";

    const COMICS_STORAGE_KEY = "comic_cards_comics";
    const RATINGS_STORAGE_KEY = "comic_cards_ratings";

    const adminBtn = document.getElementById("adminBtn");
    const userInfo = document.getElementById("userInfo");
    const logoutBtn = document.getElementById("logoutBtn");
    const guestSection = document.getElementById("guestSection");
    const catalogSection = document.getElementById("catalogSection");
    const comicsGrid = document.getElementById("comicsGrid");

    let currentUser = null;

    function loadJson(key) {
      try {
        return JSON.parse(localStorage.getItem(key)) || [];
      } catch {
        return [];
      }
    }

    function saveJson(key, value) {
      localStorage.setItem(key, JSON.stringify(value));
    }

    function escapeHtml(value = "") {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function extractGoogleDriveFileId(url) {
      if (!url) return null;

      const patterns = [
        /\/file\/d\/([a-zA-Z0-9_-]+)/,
        /[?&]id=([a-zA-Z0-9_-]+)/,
        /\/d\/([a-zA-Z0-9_-]+)/
      ];

      for (const pattern of patterns) {
        const match = url.match(pattern);
        if (match && match[1]) return match[1];
      }

      return null;
    }

    function getCoverImageUrl(url) {
      const fileId = extractGoogleDriveFileId(url);

      if (fileId) {
        return `https://drive.google.com/thumbnail?id=${fileId}&sz=w1000`;
      }

      return url;
    }

    function getRatings() {
      return loadJson(RATINGS_STORAGE_KEY);
    }

    function getComicRatingData(comicId) {
      const ratings = getRatings().filter(item => item.comicId === comicId);

      if (ratings.length === 0) {
        return {
          average: 0,
          count: 0
        };
      }

      const total = ratings.reduce((sum, item) => sum + Number(item.value || 0), 0);

      return {
        average: total / ratings.length,
        count: ratings.length
      };
    }

    function getUserRating(comicId) {
      if (!currentUser) return 0;

      const rating = getRatings().find(
        item => item.comicId === comicId && item.userId === currentUser.uid
      );

      return rating ? Number(rating.value) : 0;
    }

    function saveRating(comicId, value) {
      if (!currentUser) return;

      const ratings = getRatings();

      const existing = ratings.find(
        item => item.comicId === comicId && item.userId === currentUser.uid
      );

      if (existing) {
        existing.value = value;
        existing.updatedAt = new Date().toISOString();
      } else {
        ratings.push({
          comicId,
          userId: currentUser.uid,
          value,
          createdAt: new Date().toISOString()
        });
      }

      saveJson(RATINGS_STORAGE_KEY, ratings);
      renderComics();
    }

    function starsText(average) {
      const rounded = Math.round(average);
      return "★".repeat(rounded) + "☆".repeat(5 - rounded);
    }

    function renderComics() {
      const comics = loadJson(COMICS_STORAGE_KEY);

      if (comics.length === 0) {
        comicsGrid.innerHTML = `
          <div class="empty-state">
            📭 Поки що коміксів немає.
          </div>
        `;
        return;
      }

      comicsGrid.innerHTML = comics.map(comic => {
        const rating = getComicRatingData(comic.id);
        const userRating = getUserRating(comic.id);

        const cover = comic.cover
          ? getCoverImageUrl(comic.cover)
          : "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(`
              <svg xmlns="http://www.w3.org/2000/svg" width="600" height="900">
                <rect width="100%" height="100%" fill="#101010"/>
                <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle"
                      fill="#666" font-size="42">COMIC</text>
              </svg>
            `);

        return `
          <article class="comic-card">
            <div class="comic-cover">
              <img
                src="${escapeHtml(cover)}"
                alt="${escapeHtml(comic.title)}"
              >
            </div>

            <div class="comic-info">
              <div class="comic-title">
                ${escapeHtml(comic.title)}
              </div>

              <div class="comic-description">
                ${escapeHtml(comic.description || "Без опису")}
              </div>

              <div class="rating-summary">
                <span class="rating-stars">
                  ${starsText(rating.average)}
                </span>

                <strong>
                  ${rating.count ? rating.average.toFixed(1) : "—"}
                </strong>

                <span class="rating-count">
                  ${rating.count} ${rating.count === 1 ? "оцінка" : "оцінок"}
                </span>
              </div>

              <div class="rate-box">
                <span class="rate-label">Твоя оцінка:</span>

                <div class="rate-stars">
                  ${[1,2,3,4,5].map(star => `
                    <button
                      type="button"
                      class="rate-star ${star <= userRating ? "active" : ""}"
                      data-comic-id="${escapeHtml(comic.id)}"
                      data-rating="${star}"
                      title="${star} з 5"
                    >★</button>
                  `).join("")}
                </div>
              </div>

              <a
                class="read-btn"
                href="reader.html?comic=${encodeURIComponent(comic.id)}"
              >📖 Читати</a>
            </div>
          </article>
        `;
      }).join("");

      document.querySelectorAll(".rate-star").forEach(button => {
        button.addEventListener("click", () => {
          saveRating(
            button.dataset.comicId,
            Number(button.dataset.rating)
          );
        });
      });
    }

    onAuthStateChanged(auth, (user) => {
      currentUser = user;

      if (user) {
        guestSection.style.display = "none";
        catalogSection.style.display = "block";

        userInfo.textContent = `Ви увійшли як: ${user.email}`;
        logoutBtn.style.display = "inline-block";

        if (user.uid === ADMIN_UID) {
          adminBtn.style.display = "inline-block";
        } else {
          adminBtn.style.display = "none";
        }

        renderComics();
      } else {
        guestSection.style.display = "block";
        catalogSection.style.display = "none";

        userInfo.textContent = "";
        logoutBtn.style.display = "none";
        adminBtn.style.display = "none";
      }
    });

    logoutBtn.addEventListener("click", async () => {
      await signOut(auth);
      window.location.reload();
    });
  </script>

</body>
</html>
