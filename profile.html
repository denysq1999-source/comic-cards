<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Особистий кабінет | Comic Cards</title>

  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Arial,sans-serif;background:#0f0f0f;color:#fff;min-height:100vh}
    header{background:#1a1a1a;border-bottom:1px solid #2a2a2a;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
    .brand{font-size:22px;font-weight:800;color:#ff9800}
    .top-actions{display:flex;gap:10px;flex-wrap:wrap}
    .btn{border:0;border-radius:8px;padding:10px 14px;text-decoration:none;color:#fff;background:#2b2b2b;cursor:pointer;font-weight:700}
    .btn:hover{background:#3a3a3a}.btn.orange{background:#ff9800}.btn.orange:hover{background:#e68900}
    main{width:min(1200px,calc(100% - 28px));margin:28px auto 60px}
    .profile-card{display:grid;grid-template-columns:110px 1fr;gap:18px;align-items:center;background:#1a1a1a;border:1px solid #2c2c2c;border-radius:16px;padding:22px;margin-bottom:24px}
    .avatar{width:110px;height:110px;border-radius:50%;background:#292929;border:2px solid #3b3b3b;display:flex;align-items:center;justify-content:center;font-size:42px}
    .profile-info h1{font-size:28px;margin-bottom:8px}.profile-info p{color:#aaa;margin:4px 0}.badge{display:inline-block;margin-top:8px;padding:5px 9px;border-radius:999px;background:#2b2b2b;color:#ffb347;font-size:12px;font-weight:800}
    .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:24px}
    .stat{background:#1a1a1a;border:1px solid #2c2c2c;border-radius:12px;padding:18px;text-align:center}
    .stat strong{display:block;font-size:28px;color:#ff9800}.stat span{color:#8d8d8d;font-size:13px}
    .panel{background:#1a1a1a;border:1px solid #2c2c2c;border-radius:14px;padding:20px}
    .panel h2{font-size:22px;margin-bottom:8px}.panel-sub{color:#8f8f8f;margin-bottom:18px;font-size:14px}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.toolbar select,.toolbar input{background:#101010;color:#fff;border:1px solid #363636;border-radius:8px;padding:10px 12px}.toolbar select{min-width:210px}.toolbar input{flex:1;min-width:180px}
    .inventory{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
    .item{background:#151515;border:1px solid #2c2c2c;border-radius:12px;overflow:hidden}
    .item-img{aspect-ratio:5/7;background:#0b0b0b}.item-img img{width:100%;height:100%;object-fit:cover;display:block}
    .item-body{padding:14px}.item-name{font-size:17px;font-weight:800;margin-bottom:6px}.item-comic{color:#8f8f8f;font-size:13px;margin-bottom:7px}.rarity{display:inline-block;background:#272727;border:1px solid #353535;border-radius:999px;padding:5px 9px;color:#ffb347;font-size:12px;font-weight:800;margin-bottom:10px}
    .item-meta{color:#777;font-size:12px}
    .item-actions{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .view-btn,.trash-btn{width:100%;border:0;border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:800}
    .view-btn{background:#2b3a4a;color:#dbeeff}
    .view-btn:hover{background:#35516d}
    .trash-btn{background:#2a2020;color:#ff9a9a}
    .trash-btn:hover{background:#3a2424;color:#ffb3b3}

    .viewer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.86);display:none;align-items:center;justify-content:center;padding:20px;z-index:1000}
    .viewer-overlay.show{display:flex}
    .viewer-modal{width:min(900px,96vw);max-height:92vh;background:#151515;border:1px solid #333;border-radius:16px;padding:18px;position:relative;display:grid;grid-template-columns:minmax(280px,420px) 1fr;gap:20px;overflow:auto}
    .viewer-image-wrap{
      background:#0d0d0d;
      border-radius:12px;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      perspective:1100px;
      user-select:none;
      touch-action:none;
      cursor:grab;
    }
    .viewer-image-wrap.dragging{cursor:grabbing}
    .card-3d{position:relative;width:100%;aspect-ratio:5/7;transform-style:preserve-3d;transform:rotateX(0deg) rotateY(0deg);transition:transform .35s cubic-bezier(.2,.8,.2,1);will-change:transform}
    .viewer-image-wrap.dragging .card-3d{transition:none}
    .card-face{position:absolute;inset:0;border-radius:12px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#111;border:1px solid #333}
    .card-face.front{transform:rotateY(0deg)}
    .card-face.back{transform:rotateY(180deg)}
    .card-face img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
    .generated-back{width:100%;height:100%;padding:34px 28px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 50% 30%,rgba(255,152,0,.12),transparent 40%),linear-gradient(145deg,#181818,#0b0b0b);border:10px double #6e5120;color:#eee}
    .generated-back h4{font-size:26px;margin:0 0 14px;color:#ffb347}
    .generated-back p{font-size:15px;line-height:1.6;color:#cfcfcf;white-space:pre-wrap}
    .generated-back .back-mark{font-size:44px;margin-bottom:16px}
    .card-shine{position:absolute;inset:0;pointer-events:none;opacity:0;mix-blend-mode:screen;background:radial-gradient(circle at var(--shine-x,50%) var(--shine-y,50%),rgba(255,255,255,.55) 0%,rgba(255,220,120,.22) 16%,rgba(255,255,255,0) 45%);transition:opacity .2s ease}
    .viewer-image-wrap.dragging .card-shine{opacity:.72}
    .viewer-info{display:flex;flex-direction:column;gap:10px;align-self:start}
    .viewer-info h3{font-size:28px;margin:0}
    .viewer-comic{color:#aaa}
    .viewer-rarity{display:inline-block;align-self:flex-start;background:#272727;border:1px solid #353535;color:#ffb347;border-radius:999px;padding:6px 10px;font-size:13px;font-weight:800}
    .viewer-close{position:absolute;top:10px;right:10px;width:38px;height:38px;border:0;border-radius:50%;background:#2a2a2a;color:#fff;cursor:pointer;font-size:20px}
    .viewer-close:hover{background:#3a3a3a}
    @media(max-width:760px){.viewer-modal{grid-template-columns:1fr}.viewer-image-wrap img{max-height:62vh}}
    .empty{grid-column:1/-1;border:1px dashed #333;border-radius:12px;padding:45px 20px;text-align:center;color:#777}
    @media(max-width:650px){header{align-items:flex-start;flex-direction:column}.profile-card{grid-template-columns:1fr;text-align:center}.avatar{margin:auto}.stats{grid-template-columns:1fr}}
  </style>
</head>
<body>

<header>
  <div class="brand">👤 Особистий кабінет</div>
  <div class="top-actions">
    <a class="btn" href="index.html">← На головну</a>
    <a class="btn" id="adminLink" href="admin.html" style="display:none;">⚙️ Адмін-панель</a>
    <button class="btn orange" id="logoutBtn">Вийти</button>
  </div>
</header>

<main>
  <section class="profile-card">
    <div class="avatar">👤</div>
    <div class="profile-info">
      <h1 id="displayName">Користувач</h1>
      <p id="emailText"></p>
      <span class="badge" id="roleBadge">USER</span>
    </div>
  </section>

  <section class="stats">
    <div class="stat">
      <strong id="cardsCount">0</strong>
      <span>Карток в інвентарі</span>
    </div>
    <div class="stat">
      <strong id="uniqueCount">0</strong>
      <span>Унікальних карток</span>
    </div>
    <div class="stat">
      <strong id="comicsCount">0</strong>
      <span>Коміксів у колекції</span>
    </div>
  </section>

  <section class="panel">
    <h2>🎒 Інвентар карток</h2>
    <p class="panel-sub">Тут зберігатимуться картки, які користувач отримав під час читання коміксів.</p>

    <div class="toolbar">
      <select id="comicFilter">
        <option value="">Усі комікси</option>
      </select>
      <input id="searchInput" type="search" placeholder="Пошук картки...">
    </div>

    <div class="inventory" id="inventory"></div>
  </section>
</main>


<div class="viewer-overlay" id="viewerOverlay" aria-hidden="true">
  <div class="viewer-modal">
    <button class="viewer-close" id="viewerCloseBtn" type="button">✕</button>

    <div class="viewer-image-wrap" id="viewerImageWrap" title="Затисни та рухай картку">
      <div class="card-3d" id="card3d">
        <div class="card-face front">
          <img id="viewerImage" alt="Лицьова сторона картки">
          <div class="card-shine" id="cardShineFront"></div>
        </div>
        <div class="card-face back">
          <img id="viewerBackImage" alt="Задня сторона картки" style="display:none;">
          <div class="generated-back" id="generatedBack">
            <div class="back-mark">🃏</div>
            <h4 id="backCardName"></h4>
            <p id="backCardDescription"></p>
          </div>
          <div class="card-shine" id="cardShineBack"></div>
        </div>
      </div>
    </div>

    <div class="viewer-info">
      <h3 id="viewerName"></h3>
      <div class="viewer-comic" id="viewerComic"></div>
      <span class="viewer-rarity" id="viewerRarity"></span>
      <div class="item-meta" id="viewerObtained"></div>
    </div>
  </div>
</div>

<script type="module">
  import { auth } from './js/firebase.js';
  import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getFirestore,
    collection,
    getDocs,
    query,
    where,
    deleteDoc,
    doc
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const db = getFirestore(auth.app);
  const ADMIN_UID = "pSMXTD18TYYLLA3CnBb8shBzHII3";

  const displayName = document.getElementById("displayName");
  const emailText = document.getElementById("emailText");
  const roleBadge = document.getElementById("roleBadge");
  const adminLink = document.getElementById("adminLink");
  const cardsCount = document.getElementById("cardsCount");
  const uniqueCount = document.getElementById("uniqueCount");
  const comicsCount = document.getElementById("comicsCount");
  const inventory = document.getElementById("inventory");
  const comicFilter = document.getElementById("comicFilter");
  const searchInput = document.getElementById("searchInput");
  const viewerOverlay = document.getElementById("viewerOverlay");
  const viewerCloseBtn = document.getElementById("viewerCloseBtn");
  const viewerImage = document.getElementById("viewerImage");
  const viewerImageWrap = document.getElementById("viewerImageWrap");
  const card3d = document.getElementById("card3d");
  const cardShineFront = document.getElementById("cardShineFront");
  const cardShineBack = document.getElementById("cardShineBack");
  const viewerBackImage = document.getElementById("viewerBackImage");
  const generatedBack = document.getElementById("generatedBack");
  const backCardName = document.getElementById("backCardName");
  const backCardDescription = document.getElementById("backCardDescription");
  const viewerName = document.getElementById("viewerName");
  const viewerComic = document.getElementById("viewerComic");
  const viewerRarity = document.getElementById("viewerRarity");
  const viewerObtained = document.getElementById("viewerObtained");

  let user = null;
  let owned = [];
  let cards = [];
  let comics = [];

  onAuthStateChanged(auth, async currentUser => {
    if (!currentUser) {
      location.href = "login.html";
      return;
    }

    user = currentUser;

    displayName.textContent =
      currentUser.displayName ||
      (currentUser.email ? currentUser.email.split("@")[0] : "Користувач");

    emailText.textContent = currentUser.email || "";
    if (currentUser.uid === ADMIN_UID) {
      roleBadge.textContent = "ADMIN";
      adminLink.style.display = "inline-block";
    } else {
      roleBadge.textContent = "USER";
    }

    await loadInventory();
  });

  document.getElementById("logoutBtn").addEventListener("click", async () => {
    await signOut(auth);
    location.href = "login.html";
  });

  async function loadInventory() {
    const [ownedSnap, cardSnap, comicSnap] = await Promise.all([
      getDocs(query(collection(db, "user_cards"), where("userId", "==", user.uid))),
      getDocs(collection(db, "cards")),
      getDocs(collection(db, "comics"))
    ]);

    owned = ownedSnap.docs.map(d => ({ id:d.id, ...d.data() }));
    cards = cardSnap.docs.map(d => ({ id:d.id, ...d.data() }));
    comics = comicSnap.docs.map(d => ({ id:d.id, ...d.data() }));

    fillComicFilter();
    updateStats();
    renderInventory();
  }

  function fillComicFilter() {
    comicFilter.innerHTML = '<option value="">Усі комікси</option>';

    const ownedComicIds = new Set(
      owned.map(o => {
        const card = cards.find(c => c.id === o.cardId);
        return card?.comicId;
      }).filter(Boolean)
    );

    comics
      .filter(c => ownedComicIds.has(c.id))
      .sort((a,b)=>String(a.title||"").localeCompare(String(b.title||""),"uk"))
      .forEach(c => {
        const option = document.createElement("option");
        option.value = c.id;
        option.textContent = c.title || "Без назви";
        comicFilter.appendChild(option);
      });
  }

  function updateStats() {
    cardsCount.textContent = owned.length;
    uniqueCount.textContent = new Set(owned.map(o => o.cardId)).size;

    const comicIds = new Set(
      owned.map(o => cards.find(c => c.id === o.cardId)?.comicId).filter(Boolean)
    );
    comicsCount.textContent = comicIds.size;
  }

  function renderInventory() {
    const filterId = comicFilter.value;
    const search = searchInput.value.trim().toLowerCase();

    const rows = owned.map(own => {
      const card = cards.find(c => c.id === own.cardId);
      if (!card) return null;
      const comic = comics.find(c => c.id === card.comicId);

      return { own, card, comic };
    }).filter(Boolean).filter(row => {
      const matchesComic = !filterId || row.card.comicId === filterId;
      const matchesSearch = !search || String(row.card.name||"").toLowerCase().includes(search);
      return matchesComic && matchesSearch;
    });

    if (!rows.length) {
      inventory.innerHTML = `
        <div class="empty">
          🎒 Інвентар поки що порожній.<br>
          Картки з'являться тут після того, як ми підключимо випадіння під час читання.
        </div>
      `;
      return;
    }

    inventory.innerHTML = rows.map(({own, card, comic}) => `
      <article class="item">
        <div class="item-img">
          <img src="${esc(card.image ? driveImage(card.image) : placeholder())}" alt="${esc(card.name||"Картка")}">
        </div>
        <div class="item-body">
          <div class="item-name">${esc(card.name||"Без назви")}</div>
          <div class="item-comic">${esc(comic?.title||"Невідомий комікс")}</div>
          <span class="rarity">${esc(card.rarity||"Common")}</span>
          <div class="item-meta">
            Отримано: ${formatDate(own.obtainedAt)}
          </div>

          <div class="item-actions">
            <button
              class="view-btn"
              type="button"
              data-view-owned="${esc(own.id)}"
            >🔍 Переглянути</button>

            <button
              class="trash-btn"
              type="button"
              data-delete-owned="${esc(own.id)}"
            >🗑️ Видалити</button>
          </div>
        </div>
      </article>
    `).join("");

    document.querySelectorAll("[data-view-owned]").forEach(button => {
      button.addEventListener("click", () => {
        const ownedId = button.dataset.viewOwned;
        const ownedCard = owned.find(item => item.id === ownedId);
        if (!ownedCard) return;

        const card = cards.find(item => item.id === ownedCard.cardId);
        if (!card) return;

        const comic = comics.find(item => item.id === card.comicId);

        viewerImage.src = card.image ? driveImage(card.image) : placeholder();
        if (card.backImage) {
          viewerBackImage.src = driveImage(card.backImage);
          viewerBackImage.style.display = "block";
          generatedBack.style.display = "none";
        } else {
          viewerBackImage.removeAttribute("src");
          viewerBackImage.style.display = "none";
          generatedBack.style.display = "flex";
          backCardName.textContent = card.name || "Без назви";
          backCardDescription.textContent = card.backDescription || card.description || "Опис відсутній.";
        }
        cardRotationY = 0; cardRotationX = 0; applyCardTransform();
        [cardShineFront, cardShineBack].forEach(sh=>{sh.style.setProperty("--shine-x","50%");sh.style.setProperty("--shine-y","50%");});
        viewerName.textContent = card.name || "Без назви";
        viewerComic.textContent = comic?.title || "Невідомий комікс";
        viewerRarity.textContent = card.rarity || "Common";
        viewerObtained.textContent = `Отримано: ${formatDate(ownedCard.obtainedAt)}`;

        viewerOverlay.classList.add("show");
        viewerOverlay.setAttribute("aria-hidden", "false");
        document.body.style.overflow = "hidden";
      });
    });

    document.querySelectorAll("[data-delete-owned]").forEach(button => {
      button.addEventListener("click", async () => {
        const ownedId = button.dataset.deleteOwned;
        const ownedCard = owned.find(item => item.id === ownedId);
        if (!ownedCard) return;

        const card = cards.find(item => item.id === ownedCard.cardId);
        const cardName = card?.name || "цю картку";

        const confirmed = confirm(
          `Картку «${cardName}» буде видалено з інвентарю. Ви впевнені?`
        );

        if (!confirmed) return;

        try {
          await deleteDoc(doc(db, "user_cards", ownedId));
          await loadInventory();
        } catch (error) {
          console.error(error);
          alert("Не вдалося видалити картку.");
        }
      });
    });
  }


  // ===== 3D картка: перед + зад як один об'єкт =====
  let cardDragging=false,activePointerId=null,dragStartX=0,dragStartY=0,dragStartRotationY=0,cardRotationY=0,cardRotationX=0;
  function normalizeAngle(a){a%=360;if(a<0)a+=360;return a}
  function applyCardTransform(){card3d.style.transform=`rotateX(${cardRotationX.toFixed(2)}deg) rotateY(${cardRotationY.toFixed(2)}deg)`}
  function updateShine(e){const r=viewerImageWrap.getBoundingClientRect();const x=Math.max(0,Math.min(r.width,e.clientX-r.left));const y=Math.max(0,Math.min(r.height,e.clientY-r.top));const sx=`${(x/r.width*100).toFixed(1)}%`,sy=`${(y/r.height*100).toFixed(1)}%`;[cardShineFront,cardShineBack].forEach(sh=>{sh.style.setProperty("--shine-x",sx);sh.style.setProperty("--shine-y",sy)})}
  viewerImageWrap.addEventListener("pointerdown",e=>{if(!viewerOverlay.classList.contains("show"))return;cardDragging=true;activePointerId=e.pointerId;dragStartX=e.clientX;dragStartY=e.clientY;dragStartRotationY=cardRotationY;viewerImageWrap.classList.add("dragging");viewerImageWrap.setPointerCapture(e.pointerId);updateShine(e)});
  viewerImageWrap.addEventListener("pointermove",e=>{if(!cardDragging||e.pointerId!==activePointerId)return;const r=viewerImageWrap.getBoundingClientRect();const dx=e.clientX-dragStartX,dy=e.clientY-dragStartY;cardRotationY=dragStartRotationY+(dx/r.width)*220;cardRotationX=Math.max(-15,Math.min(15,-(dy/r.height)*30));applyCardTransform();updateShine(e)});
  function finishCardDrag(e){if(!cardDragging)return;if(e&&activePointerId!==null&&e.pointerId!==activePointerId)return;cardDragging=false;activePointerId=null;viewerImageWrap.classList.remove("dragging");const n=normalizeAngle(cardRotationY),back=n>90&&n<270;cardRotationY=back?Math.round(cardRotationY/360)*360+180:Math.round(cardRotationY/360)*360;cardRotationX=0;applyCardTransform()}
  viewerImageWrap.addEventListener("pointerup",finishCardDrag);viewerImageWrap.addEventListener("pointercancel",finishCardDrag);viewerImageWrap.addEventListener("lostpointercapture",()=>{if(cardDragging)finishCardDrag()});
  function resetCard3D(){cardDragging=false;activePointerId=null;cardRotationY=0;cardRotationX=0;viewerImageWrap.classList.remove("dragging");applyCardTransform();[cardShineFront,cardShineBack].forEach(sh=>{sh.style.setProperty("--shine-x","50%");sh.style.setProperty("--shine-y","50%")})}

  function closeViewer() {
    resetCard3D();
    viewerOverlay.classList.remove("show");
    viewerOverlay.setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";
  }

  viewerCloseBtn.addEventListener("click", closeViewer);

  viewerOverlay.addEventListener("click", event => {
    if (event.target === viewerOverlay) closeViewer();
  });

  document.addEventListener("keydown", event => {
    if (event.key === "Escape" && viewerOverlay.classList.contains("show")) {
      closeViewer();
    }
  });

  comicFilter.addEventListener("change", renderInventory);
  searchInput.addEventListener("input", renderInventory);

  function driveImage(url) {
    const m =
      url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) ||
      url.match(/[?&]id=([a-zA-Z0-9_-]+)/);

    return m
      ? `https://drive.google.com/thumbnail?id=${m[1]}&sz=w1200`
      : url;
  }

  function placeholder() {
    return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="700" height="980">' +
      '<rect width="100%" height="100%" fill="#101010"/>' +
      '<text x="50%" y="50%" text-anchor="middle" fill="#666" font-size="48">CARD</text>' +
      '</svg>'
    );
  }

  function formatDate(value) {
    if (!value) return "—";

    if (value.toDate) {
      return value.toDate().toLocaleDateString("uk-UA");
    }

    const d = new Date(value);
    return isNaN(d) ? "—" : d.toLocaleDateString("uk-UA");
  }

  function esc(v="") {
    return String(v)
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }
</script>

</body>
</html>
