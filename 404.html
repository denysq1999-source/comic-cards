<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 | Comic Cards</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#111;color:#fff;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}
    .box{width:min(650px,100%);background:#1a1a1a;border:1px solid #303030;border-radius:18px;padding:48px 28px;text-align:center}
    .code{font-size:84px;font-weight:900;color:#ff9800;line-height:1}
    h1{margin:14px 0 10px}
    p{color:#999;line-height:1.6;margin:0 auto 24px}
    .actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
    a{padding:12px 18px;border-radius:9px;text-decoration:none;font-weight:800;background:#ff9800;color:#fff}
    a.secondary{background:#2d2d2d}
  </style>
</head>
<body>
  <main class="box">
    <div class="code">404</div>
    <h1>Сторінку не знайдено</h1>
    <p>Схоже, такого розділу немає або посилання застаріло.</p>
    <div class="actions">
      <a href="index.html">🏠 На головну</a>
      <a class="secondary" href="login.html">🔐 Увійти</a>
    </div>
  </main>
</body>
</html>
